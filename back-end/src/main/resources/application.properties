spring.application.name=Scout Play Application
spring.profiles.default=dev

# ============== DATASOURCE ==============
# Credenciais definidas por perfil (application-dev.properties / application-prod.properties)
# ou via variáveis de ambiente DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scoutplaydb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============== CORS CONFIG ==============
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# ============== JWT CONFIG ==============
# Cada perfil define app.jwt.secret individualmente:
#   dev  → application-dev.properties (chave local, arquivo ignorado pelo git)
#   prod → application-prod.properties via variável de ambiente JWT_SECRET (obrigatória)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expirationMs=${JWT_EXPIRATION:86400000}

# ============== FILE UPLOAD CONFIG ==============
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/

# ============== JSON SERIALIZATION ==============
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ============== IA SERVICE ==============
app.ia.url=${IA_URL:http://localhost:8081}
app.ia.max-athletes=${IA_MAX_ATHLETES:100}
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.password-reset.ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:30}
app.seed.password=${SEED_PASSWORD:}

# ============== COOKIE CONFIG ==============
# Em produção defina COOKIE_SECURE=true (exige HTTPS)
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Reduz consultas repetidas ao carregar relacionamentos lazy em listas e feeds.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ============== EMAIL ==============
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# ============== LOGGING ==============
logging.level.com.scoutplay=DEBUG
