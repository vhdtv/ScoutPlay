name: CI

on:
  push:
    branches: [ScoutPlay2.0, historico]
  pull_request:
    branches: [ScoutPlay2.0]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes e cobertura
        run: sh ./mvnw --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Verificar estilo e tipos
        run: npm run check
      - name: Testes
        run: npm test
      - name: Build de produção
        run: npm run build
